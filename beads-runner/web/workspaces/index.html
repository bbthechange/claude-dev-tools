<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Beads Runner — Workspaces</title>
<!--
  Workspaces Hub (label: workspaces-hub; Brian ask B6; UX-DESIGN-V2 §2.1/§2.2)
  — the NEW global view that answers "Which workspaces are healthy / busy /
  stuck / need me?" in one glance, then routes into a workspace's Board.
  Cloudflare Pages route /workspaces (rewrite to /workspaces/ in _redirects).
  Reads ONLY the §4.5 projection via /api/board (the §9.1 read chokepoint); NO
  write path — every card is an <a> into /ws/<ref>/board. The Inbox is still
  the product, so the global decisions total is surfaced at the top.

  ABSOLUTE asset paths throughout (a relative ./x would 404 under the clean
  /workspaces rewrite — the q6z7 lesson). tokens.css is linked FIRST, then the
  page CSS; the shared modules load before this page's view-model + glue.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/workspaces/workspaces.css">
</head>
<body>
  <main class="app" id="app" aria-live="polite">
    <header class="apphead">
      <div class="t"><span class="dot" id="head-dot"></span>Workspaces</div>
      <div class="who" id="who" title="The §9.1 constant principal (AD6; C7 later)">—</div>
    </header>

    <div class="scroll" id="scroll">
      <p class="loading" id="loading">Reading the projection…</p>

      <section id="hub" hidden>
        <!-- DECISIONS HERO — the Inbox is still the product (UX-DESIGN-V2 §2.3) -->
        <div class="dec">
          <span class="dec-num" id="dec-total">0</span>
          <div class="dec-body">
            <span class="dec-eye">WAITING ON YOU · ALL WORKSPACES</span>
            <span class="dec-lbl" id="dec-label">—</span>
          </div>
          <a class="dec-link" id="dec-link" href="/inbox" hidden>Open Inbox →</a>
        </div>

        <!-- INTAKE LEAK ALERT (L3 claude-tools-uxvl3) — failing/gave-up phone
             intakes across all workspaces. Hidden when zero. The 19-silent-
             retry night is exactly this number being >0 and invisible. -->
        <div class="intake-alert" id="intake-alert" hidden>
          <span class="intake-alert-num" id="intake-alert-num">0</span>
          <span class="intake-alert-lbl" id="intake-alert-lbl">—</span>
        </div>

        <!-- WORKSPACE CARDS — attention/stale first, then live, then by ref -->
        <div class="section-lbl">Workspaces · healthy · busy · stuck · need me</div>
        <div class="cards" id="cards"></div>
        <p class="cards-empty" id="cards-empty" hidden>No workspaces reported in the projection.</p>
      </section>

      <section class="errbox" id="errbox" hidden>
        <div class="err-h">Cannot render Workspaces</div>
        <p class="err-b" id="err-b"></p>
      </section>
    </div>

    <footer class="foot" id="foot">
      <span id="foot-status">read-only projection · no write path · derived tallies labeled</span>
      <span class="foot-sep">·</span>
      <span id="foot-updated">—</span>
    </footer>
  </main>

  <!-- Absolute paths (q6z7): shared modules first, then this page's view-model
       + glue, in dependency order. -->
  <script src="/shared/net.js"></script>
  <script src="/shared/dom.js"></script>
  <script src="/shared/shell.js"></script>
  <script src="/workspaces/workspaces-view.js"></script>
  <!-- wmmc (claude-tools-wmmc): the §8.5 live mini-MAP thumbnail reuses the H2 map
       renderer at thumb scale. Loaded verbatim from /workspace/ (absolute, q6z7) —
       the same pure module the Blueprint facet uses; app.js calls its
       deriveBlueprintThumb on the LAZILY-fetched per-card blueprint-get body. -->
  <script src="/workspace/blueprint-view.js"></script>
  <script src="/workspaces/app.js"></script>
  <!-- claude-tools-4zrn: shared offline-read service worker (last-known snapshot
       off-network; UX-DESIGN-V2 §2.4). NOT on the Inbox (S-1). -->
  <script src="/shared/sw-register.js"></script>
</body>
</html>
