<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Beads Runner — Intake</title>
<!--
  I1 (claude-tools-tbl) — phone INTAKE: UX-DESIGN Flow A.
  "You (phone): one text box + project picker (or let it pick) + tap an
  entry-intent preset." Tap the icon, type one sentence, tap Submit — ~5
  seconds of effort.

  Cloudflare Pages app shell. No build step. Reuses the T6a/T6b visual
  language (same tokens, fonts) so this is the SAME product, not a third
  look — anti-drift. The §9.1 chokepoint lives in functions/api/intake/* (the
  unified Pages tree — see claude-tools-b59). The browser holds NO secret and
  never picks the principal/op (§9.1/§9.2). The single WRITE call is the I2
  POST /api/intake.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Absolute asset paths (/intake/*, /shared/*): this page is served under clean routes,
     so a relative ./ path would 404 (the board page is the reference). tokens.css first. -->
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/intake/intake.css">
</head>
<body>
  <main class="app" id="app" aria-live="polite">
    <header class="apphead">
      <div class="t"><span class="dot" id="dot"></span>Intake</div>
      <div class="who" id="who" title="§9.1 constant principal (AD6; C7 later)">—</div>
    </header>

    <form class="form" id="form" novalidate>
      <!-- ONE text box: the idea. -->
      <label class="lbl" for="idea">Your idea</label>
      <textarea id="idea" name="idea" rows="4"
        autocomplete="off"
        autocapitalize="sentences"
        spellcheck="true"
        placeholder="One sentence. The runner figures out the rest."
        aria-describedby="idea-hint"></textarea>
      <p id="idea-hint" class="hint">One sentence is enough — the enricher fills in the dossier.</p>

      <!-- Project picker — populated from /api/intake/workspaces. -->
      <label class="lbl" for="workspace">Workspace</label>
      <div class="picker">
        <select id="workspace" name="workspace" aria-describedby="ws-hint">
          <option value="" disabled selected>Loading workspaces…</option>
        </select>
      </div>
      <p id="ws-hint" class="hint" hidden></p>

      <!-- Preset chooser — populated at run-time from /api/intake/presets
           (I4, claude-tools-vvh). The canonical catalog is
           agents/intake-presets.json; the Pages-side mirror is
           functions/api/intake/_presets-catalog.js. Adding a preset is the
           one-PR playbook in agents/intake-presets.md — no edit to
           this HTML is required. -->
      <fieldset class="presets" id="presets">
        <legend class="lbl">Entry intent</legend>
        <p class="hint" id="presets-loading">Loading entry intents…</p>
      </fieldset>

      <button class="submit" id="submit" type="submit" disabled>
        <span id="submit-label">Submit</span>
      </button>

      <p class="errline" id="errline" hidden></p>
    </form>

    <!-- Confirmation pane (after a successful submit). The Board will reflect
         the new bead within seconds (per the I1 ACCEPTANCE criterion). -->
    <section class="confirm" id="confirm" hidden>
      <div class="seal">✓</div>
      <h2>Submitted.</h2>
      <p class="ack">The enricher will pick it up on its next sweep. Watch
        the Board — the bead lands within seconds.</p>
      <p class="receipt" id="receipt"></p>
      <div class="cta">
        <button class="btn primary" id="another" type="button">Another</button>
        <a class="btn" id="goboard" href="/board">Open Board</a>
      </div>
    </section>

    <footer class="foot">
      <span>one text box · one tap · ~5 seconds</span>
      <span class="sep">·</span>
      <a class="navlink" href="/board">Board</a>
      <span class="sep">·</span>
      <a class="navlink" href="/inbox">Inbox</a>
    </footer>
  </main>

  <div class="pop" id="pop"><span id="popmsg"></span></div>

  <script src="/shared/net.js"></script>
  <script src="/shared/dom.js"></script>
  <script src="/shared/shell.js"></script>
  <script src="/intake/app.js"></script>
  <script>Shell.mount({active:null});</script>
</body>
</html>
